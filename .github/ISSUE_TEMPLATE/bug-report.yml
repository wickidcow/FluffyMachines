name: Bug report
description: Report a reproducible FluffyMachines problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a FluffyMachines problem. Include enough detail for another person to reproduce it.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested the unmodified release file.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: I checked the server log for related errors.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what broke and which machine or item was involved.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Place or obtain ...
        2. Interact with ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: log
    attributes:
      label: Server log or error-report link
      description: Upload logs to a paste service rather than pasting a full log into the issue.

  - type: dropdown
    id: server
    attributes:
      label: Server software
      options:
        - Paper
        - Purpur
        - Spigot
        - Other
    validations:
      required: true

  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
    validations:
      required: true

  - type: textarea
    id: slimefun
    attributes:
      label: Slimefun / Slimefun Legacy version
      description: Include the complete `/sf versions` output when available.
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: FluffyMachines version
    validations:
      required: true

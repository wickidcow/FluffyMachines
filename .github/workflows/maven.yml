name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    if: startsWith(github.event.head_commit.message, '[CI skip]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: 'maven'
      - name: Verify Slimefun-relocated Dough API imports
        run: |
          if grep -R --line-number '^import io\.github\.bakedlibs\.dough' src/main/java; then
            echo 'Direct Dough imports are incompatible with the Slimefun-shaded API.'
            exit 1
          fi
      - name: Verify Paper 26.2 API names
        run: |
          if grep -R --line-number -E 'Particle\.(WATER_SPLASH|VILLAGER_HAPPY|REDSTONE)|PotionEffectType\.SLOW\b|Effect\.STEP_SOUND' src/main/java; then
            echo 'Removed or removal-pending Bukkit API names are still present.'
            exit 1
          fi
          if grep -R --line-number -E '(^|[^[:alnum:]_])lombok([.;]|$)|@(SneakyThrows|UtilityClass|AllArgsConstructor|Getter)' src/main/java pom.xml; then
            echo 'Lombok must not be required by this Java 25 build.'
            exit 1
          fi
      - name: Verify Gugu 2025.1 Dolly API usage
        run: |
          if grep -R --line-number -E 'getOrCreateProfileAsync|PlayerBackpack\.getAsync\([^,)]*\)|getBackpackAsync\([^,;]*\);' src/main/java; then
            echo 'Unsupported one-argument Dolly profile/backpack API call detected.'
            exit 1
          fi
      - name: Verify removal-pending compatibility APIs
        run: |
          if grep -R --line-number -E 'ItemStackHelper|Effect\.VILLAGER_PLANT_GROW' src/main/java; then
            echo 'Removal-pending inventory-name or plant-effect API detected.'
            exit 1
          fi
      - name: Verify Dolly copper chest compatibility
        run: |
          grep -q 'endsWith("_COPPER_CHEST")' src/main/java/io/ncbpfluffybear/fluffymachines/items/tools/Dolly.java
          grep -q 'SECOND_CHEST_TYPE_KEY' src/main/java/io/ncbpfluffybear/fluffymachines/items/tools/Dolly.java
      - name: Verify English Dolly owner lore
        run: |
          if grep -R --line-number 'PlayerBackpack\.LORE_OWNER' src/main/java/io/ncbpfluffybear/fluffymachines/utils/FluffyItems.java; then
            echo 'Dolly owner lore must not inherit a translated dependency constant.'
            exit 1
          fi
          grep -Fq '"&7Owner: "' src/main/java/io/ncbpfluffybear/fluffymachines/utils/FluffyItems.java
          grep -q 'normalizeOwnerLore' src/main/java/io/ncbpfluffybear/fluffymachines/items/tools/Dolly.java

      - name: Build with Maven
        run: mvn -B verify --file pom.xml

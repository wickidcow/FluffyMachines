name: Build FluffyMachines

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify English Dolly owner lore
        run: |
          if grep -R --line-number 'PlayerBackpack\.LORE_OWNER' src/main/java/io/ncbpfluffybear/fluffymachines/utils/FluffyItems.java; then
            echo 'Dolly owner lore must not inherit a translated dependency constant.'
            exit 1
          fi
          grep -Fq '"&7Owner: "' src/main/java/io/ncbpfluffybear/fluffymachines/utils/FluffyItems.java
          grep -q 'normalizeOwnerLore' src/main/java/io/ncbpfluffybear/fluffymachines/items/tools/Dolly.java

      - name: Build and verify
        run: mvn -B clean verify --file pom.xml

      - name: Upload compiled plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: FluffyMachines-${{ github.run_number }}
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
          retention-days: 30

name: Build FluffyMachines

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and verify
        run: mvn -B clean verify --file pom.xml

      - name: Upload compiled plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: FluffyMachines-${{ github.run_number }}
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
          retention-days: 30
